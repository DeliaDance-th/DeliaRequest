<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess Floral Garden | Mix Song</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-pink: #e8a5c8;
            --accent-gold: #d4af37;
            --text-color: #5a4a42;
            --floral-shadow: 0 8px 32px 0 rgba(232, 165, 200, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#f7e1ec 1px, transparent 1px), radial-gradient(#f7e1ec 1px, var(--bg-color) 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text-color);
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #b07d9b;
            margin-bottom: 5px;
        }

        header p {
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #8c7873;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--primary-pink);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            color: var(--text-color);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--primary-pink);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--floral-shadow);
        }

        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .song-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(232, 165, 200, 0.4);
            box-shadow: var(--floral-shadow);
            backdrop-filter: blur(8px);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .song-card:hover {
            transform: translateY(-5px);
        }

        .song-card::before {
            content: '🌸';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.2rem;
            opacity: 0.6;
        }

        .song-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-gold);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .song-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .song-artist {
            font-size: 0.9rem;
            color: #8c7873;
            margin-bottom: 15px;
        }

        .play-btn {
            background: transparent;
            border: 1.5px solid var(--primary-pink);
            color: var(--text-color);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .play-btn:hover {
            background: var(--primary-pink);
            color: white;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.85rem;
            color: #a3918c;
        }
    </style>
</head>
<body>

    <header>
        <h1>Royal Blossom Sanctuary</h1>
        <p>✨ Curated Mix Songs & Floral Aesthetics ✨</p>
    </header>

    <div class="container">
        <!-- Navigation / Category Filters -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="filterSongs('all')">🌷 All Melodies</button>
            <button class="tab-btn" onclick="filterSongs('global')">🌍 Global & TikTok</button>
            <button class="tab-btn" onclick="filterSongs('kpop')">💖 K-Pop</button>
            <button class="tab-btn" onclick="filterSongs('jpop')">🌸 J-Pop</button>
            <button class="tab-btn" onclick="filterSongs('tpop')">👑 T-Pop</button>
        </div>

        <!-- Playlist Container -->
        <div class="playlist-grid" id="playlistGrid">
            <!-- Items can be dynamically populated or added via HTML -->
            <div class="song-card" data-category="kpop">
                <div class="song-category">K-Pop</div>
                <div class="song-title">Sparkling Night</div>
                <div class="song-artist">Special Stage Mix</div>
                <button class="play-btn">Listen 🎶</button>
            </div>

            <div class="song-card" data-category="global">
                <div class="song-category">Global / TikTok</div>
                <div class="song-title">Viral Challenge Track</div>
                <div class="song-artist">Trending Edit</div>
                <button class="play-btn">Listen 🎶</button>
            </div>

            <div class="song-card" data-category="jpop">
                <div class="song-category">J-Pop</div>
                <div class="song-title">Sakura Dreaming</div>
                <div class="song-artist">Anime & Chill</div>
                <button class="play-btn">Listen 🎶</button>
            </div>

            <div class="song-card" data-category="tpop">
                <div class="song-category">T-Pop</div>
                <div class="song-title">Rising Star Anthem</div>
                <div class="song-artist">Thai Pop Hits</div>
                <button class="play-btn">Listen 🎶</button>
            </div>
        </div>
    </div>

    <footer>
        Designed with Princess Floral Concept &bull; Hosted on GitHub Pages
    </footer>

    <script>
        function filterSongs(category) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const cards = document.querySelectorAll('.song-card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
